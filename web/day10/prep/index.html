
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- Make the page adapt to mobile screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Day 10 - AJAX</title>

    <!-- Import Bootstrap's CSS styles. -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>

    <!-- Bootstrap container centers the content and adds spacing. -->
    <main class="container py-5">
        <h1>Day 10 - AJAX</h1>

        <p>Learning asynchronous JavaScript and Fetch.</p>

        <!-- A Bootstrap-styled button. -->
        <button id="load-button" class="btn btn-success">
            Load data
        </button>

        <!-- JavaScript can display the server response here. -->
        <div id="result" class="mt-3"></div>
    </main>

    <!-- Import Bootstrap's JavaScript bundle. -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Import your own JavaScript file. -->
    <script src="script.js"></script>

</body>
</html>
