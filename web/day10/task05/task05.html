<!--This file creates :
the form, 
the search button, 
the error message area, 
and an empty table for the results.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 05 - Product Search</title>

    <style>
        /* Basic page styling */
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Keep each label above its input */
        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Error messages appear in red */
        .error {
            color: red;
        }

        /* The table can scroll horizontally on small screens */
        .table-container {
            overflow-x: auto;
            margin-top: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }
    </style>
</head>

<body>
    <h1>Product Search</h1>

    <!-- The form gathers all four search criteria -->
    <form id="search-form">

        <div class="field">
            <label for="type">Product type</label>
            <input
                type="text"
                id="type"
                name="type"
                placeholder="e.g. phone"
            >
        </div>

        <div class="field">
            <label for="brand">Brand</label>
            <input
                type="text"
                id="brand"
                name="brand"
                placeholder="e.g. Samsung"
            >
        </div>

        <div class="field">
            <label for="price">Price condition</label>
            <input
                type="text"
                id="price"
                name="price"
                placeholder="e.g. >100, <42, =42"
            >
        </div>

        <div class="field">
            <label for="number">Quantity required</label>
            <input
                type="text"
                id="number"
                name="number"
                placeholder="e.g. 2"
            >
        </div>

        <!-- JavaScript handles submission without reloading the page -->
        <button type="submit">Search products</button>
    </form>

    <!-- PHP errors or fetch errors will be shown here -->
    <p id="error-message" class="error" role="status" aria-live="polite"></p>

    <h2>Search results</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Brand</th>
                    <th>Price</th>
                    <th>Number</th>
                    <th>Stock</th>
                </tr>
            </thead>

            <!-- JavaScript inserts the result rows here. -->
            <tbody id="results"></tbody>
        </table>
    </div>

    <!-- The table already has its five column headings, 
    but its <tbody> is empty
    JS will fill it after a successful search -->

    <!-- Load our JS file -->
    <script src="task05.js"></script>
</body>
</html>
